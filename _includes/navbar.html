<nav class="nav">
    <a class="nav-brand" href="{{ '/' | relative_url }}">{{ site.data.profile.navbar_name }}<span class="dot">❀</span></a>
    <ul class="nav-links">
        {% for item in site.data.navigation.pages %}
        <li><a class="{% if item.name == page.navbar_title %}active{% endif %}" href="{{ item.url | relative_url }}">{{ item.name }}</a></li>
        {% endfor %}
    </ul>
</nav>
