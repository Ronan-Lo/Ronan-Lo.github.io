{%- assign cid = include.id | slugify -%}
<div class="sc-carousel" id="{{ cid }}" data-carousel style="--ch: {{ include.height | default: '340px' }};">
    <div class="sc-stage">
        {% for item in include.images %}
        <figure class="sc-slide{% if forloop.first %} is-active{% endif %}">
            {% if item.link %}<a href="{{ item.link }}" target="_blank" rel="noopener">{% endif %}
            <img class="sc-photo" src="{{ item.src | relative_url | replace: ' ', '%20' }}" alt="{{ item.title }}" loading="lazy">
            {% if item.link %}</a>{% endif %}
            <figcaption class="sc-cap">
                <span class="sc-cap-title">{{ item.title }}</span>
                {% if item.desc %}<span class="sc-cap-desc">{{ item.desc }}</span>{% endif %}
            </figcaption>
        </figure>
        {% endfor %}
        <button class="sc-arrow prev" data-prev type="button" aria-label="Previous">&#8249;</button>
        <button class="sc-arrow next" data-next type="button" aria-label="Next">&#8250;</button>
        <div class="sc-dots">
            {% for item in include.images %}
            <button class="sc-dot{% if forloop.first %} is-active{% endif %}" data-dot="{{ forloop.index0 }}" type="button" aria-label="Go to slide {{ forloop.index }}"></button>
            {% endfor %}
        </div>
    </div>
</div>
